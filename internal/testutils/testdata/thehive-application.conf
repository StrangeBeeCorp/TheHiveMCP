# Included by the TheHive docker entrypoint (which appends
# `include file("/etc/thehive/application.conf")` to its generated config).
#
# Referenced ONLY by docker-compose.license.yml — the license override used
# when THEHIVE_TEST_LICENSE is set — never by the base docker-compose.test.yml,
# so free-license mode never points at a missing license file.
#
# It points the server at the runtime-materialised license token (mounted at
# /etc/thehive/test-license.lic from the gitignored .test-license.lic.local),
# whose `organisations` quota is unlimited so the suite can create one org per
# test. The token is trusted only in Mode.Dev, which the override enables via
# the `--dev` server argument.
license.filePath = "/etc/thehive/test-license.lic"
