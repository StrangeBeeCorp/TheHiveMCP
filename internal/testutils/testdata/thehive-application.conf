# Included by the TheHive docker entrypoint (which appends
# `include file("/etc/thehive/application.conf")` to its generated config).
#
# The integration suite creates one organisation per test (see
# internal/testutils/orgs.go); TheHive's default free license caps
# `organisations` at 1. This points the server at the committed dev-signed
# token (test-license.lic) whose `organisations` quota is -1 (unlimited).
# The token is trusted only in Mode.Dev, which docker-compose.test.yml enables
# via the `--dev` server argument.
license.filePath = "/etc/thehive/test-license.lic"
