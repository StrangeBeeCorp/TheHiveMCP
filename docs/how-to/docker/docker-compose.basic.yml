# SECURITY: this exposes plain, unauthenticated HTTP on port 8082. Deploy it
# behind a TLS-terminating, authenticating reverse proxy and never publish the
# port directly to untrusted networks. Clients must send their own TheHive
# credentials unless ALLOW_ENV_CREDENTIAL_FALLBACK=true is set explicitly.
services:
  thehive-mcp:
    image: ghcr.io/strangebeecorp/thehivemcp/thehivemcp:latest
    container_name: thehive-mcp-basic
    ports:
      - "8082:8082"
    environment:
      # TheHive Configuration
      - THEHIVE_URL=${THEHIVE_URL}
      - THEHIVE_API_KEY=${THEHIVE_API_KEY}
      - THEHIVE_ORGANISATION=${THEHIVE_ORGANISATION}

      # MCP Server Configuration
      - MCP_BIND_HOST=0.0.0.0
      - MCP_PORT=8082
      - MCP_SERVER_ENDPOINT=/mcp
      - MCP_HEARTBEAT_INTERVAL=30s

      # Permissions (choose one)
      - PERMISSIONS_CONFIG=read_only        # Safe default

      - LOG_LEVEL=info

    # volumes:  # Not needed with built-in permission profiles
    #   - ./config/permissions.yaml:/app/permissions.yaml:ro
    restart: unless-stopped
    # No healthcheck override: the image ships its own probe (/app/healthcheck).
    networks:
      - thehive-mcp

networks:
  thehive-mcp:
    driver: bridge
