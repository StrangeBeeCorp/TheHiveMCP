name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.4'

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make vetlint

      - name: Run vulnerability scan
        run: make vulncheck

  integration-tests:
    runs-on: ubuntu-latest
    # Run the integration suite against every supported TheHive version, so a
    # compatibility break against any of them turns the PR red instead of going
    # unnoticed (see DL-6007). `make test-integration` brings up the docker-compose
    # test stack (TheHive + Elasticsearch + MITRE) for the selected THEHIVE_TEST_IMAGE
    # and tears it down after. Each leg boots a full TheHive (~5 min startup);
    # keep this to the versions we actually support.
    strategy:
      fail-fast: false
      matrix:
        thehive-image:
          - strangebee/thehive:5.5.2
          - strangebee/thehive:5.6.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.4'

      - name: Run integration tests
        run: make test-integration
        env:
          THEHIVE_TEST_IMAGE: ${{ matrix.thehive-image }}
