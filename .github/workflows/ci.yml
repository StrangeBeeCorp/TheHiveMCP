name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # Skip CI for docs-only changes — these can't affect the code checks or the
    # integration suite, and the integration matrix boots a full TheHive per leg
    # (~5 min each). Safe because no job here is a required status check on main;
    # if that changes, switch to a paths-filter gate job so skips still report.
    paths-ignore:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.4'

      # Mirror golangci-lint-action's cache strategy: a 7-day interval number in
      # the key forces a periodic refresh even when nothing else changes, so a
      # frozen (never-re-saved) cache can't go stale indefinitely. The go.mod +
      # .golangci.yml hash busts it earlier on a dependency or lint-config change.
      - name: Compute cache interval
        id: lint-cache
        run: echo "interval=$(( $(date +%s) / 86400 / 7 ))" >> "$GITHUB_OUTPUT"

      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.lint-cache.outputs.interval }}-${{ hashFiles('go.mod', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ steps.lint-cache.outputs.interval }}-
            golangci-lint-${{ runner.os }}-

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make lint

      - name: Run vulnerability scan
        run: make vulncheck

  docker-build:
    # Smoke-test that the production image still builds from deployment/Dockerfile
    # (a broken COPY, a renamed cmd/ path, or a bad base digest is not caught by
    # go build / golangci-lint alone). Runs in parallel with the other jobs and
    # does not push — it only proves the image assembles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: thehivemcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    runs-on: ubuntu-latest
    # Run the integration suite against every supported TheHive version, so a
    # compatibility break against any of them turns the PR red instead of going
    # unnoticed (see DL-6007). `make test-integration` brings up the docker-compose
    # test stack (TheHive + Elasticsearch + MITRE) for the selected THEHIVE_TEST_IMAGE
    # and tears it down after. Each leg boots a full TheHive (~5 min startup);
    # keep this to the versions we actually support.
    strategy:
      fail-fast: false
      matrix:
        thehive-image:
          - strangebee/thehive:5.5.2
          - strangebee/thehive:5.6.3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.4'

      - name: Run integration tests
        run: make test-integration
        env:
          THEHIVE_TEST_IMAGE: ${{ matrix.thehive-image }}
