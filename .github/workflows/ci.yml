name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # Skip CI for docs-only changes — these can't affect the code checks or the
    # integration suite, and the integration matrix boots a full TheHive per leg
    # (~5 min each). Safe because no job here is a required status check on main;
    # if that changes, switch to a paths-filter gate job so skips still report.
    paths-ignore:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  checks:
    runs-on: ubuntu-latest
    # GO_CACHE_DIR makes the Makefile bind these host dirs into the tool
    # containers as the runner uid (see the Makefile note), so the cache below
    # is actually mounted AND is runner-owned for actions/cache to save. This is
    # set job-wide so every make step (fmt/lint/sast/vulncheck) uses it.
    env:
      GO_CACHE_DIR: /home/runner/.cache/thehivemcp-go
    steps:
      - uses: actions/checkout@v4

      # The make targets run inside pinned images and bind-mount these host caches
      # (via GO_CACHE_DIR / DOCKER_CACHE_MOUNTS / GOLANGCI_CACHE). Without them every
      # run re-downloads the whole dependency graph, recompiles gosec/govulncheck,
      # rebuilds every package, and re-analyzes every file with golangci-lint from
      # scratch. Four subdirs under GO_CACHE_DIR:
      #   gomod    — downloaded dependency source (module cache, /go/pkg/mod)
      #   gobuild  — compiled package objects (GOCACHE: go build/test + golangci)
      #   go-tools — go-installed tools (gosec, govulncheck)
      #   golangci — golangci-lint's own per-file analysis results
      # Keyed on go.sum + the lint config so a dependency or lint-rule change busts
      # it; restore-keys allow a partial warm start on a miss.
      - name: Cache Go and golangci-lint caches
        uses: actions/cache@v4
        with:
          path: ${{ env.GO_CACHE_DIR }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Prepare cache dirs
        run: mkdir -p "$GO_CACHE_DIR"/gomod "$GO_CACHE_DIR"/gobuild "$GO_CACHE_DIR"/go-tools "$GO_CACHE_DIR"/golangci

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make lint

      - name: Run SAST
        run: make sast

      - name: Run vulnerability scan
        run: make vulncheck

      - name: Lint Dockerfiles
        run: make dockerlint

      - name: Scan for secrets
        run: make secrets

  docker-build:
    # Smoke-test that the production image still builds from deployment/Dockerfile
    # (a broken COPY, a renamed cmd/ path, or a bad base digest is not caught by
    # go build / golangci-lint alone). Runs in parallel with the other jobs and
    # does not push — it only proves the image assembles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: thehivemcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mcpb-package:
    # Exercise the MCPB packaging path on PRs that touch its inputs. The release
    # workflow is the only other place this runs, so container-permission and
    # empty-artifact bugs (DL-6329: /workspace not writable by the container
    # user, producing zero-byte .mcpb that only failed at Create Release) used to
    # surface only at release time. This packages one target through the exact
    # CI path (`make mcpb-smoke` -> mcpb-ci-nobuild) on a Linux runner, where the
    # workspace-ownership uid mismatch actually reproduces (Docker Desktop for
    # Mac masks it), and asserts the output is a non-empty, valid MCPB.
    runs-on: ubuntu-latest
    env:
      # Never auto-download a Go toolchain into GOMODCACHE: setup-go installs the
      # pinned version into the tool cache, and `local` keeps every build step
      # from re-materializing a toolchain@… dir that collides with the cache
      # restore (`tar: … File exists`, DL-6329 release run).
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against for the path gate below.
          fetch-depth: 0

      # Gate: only do the expensive build+package when a packaging input changed.
      # git diff against the PR base keeps this in one job (no third-party
      # paths-filter action) and still reports a green check when skipped.
      - name: Detect MCPB packaging changes
        id: changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "No PR base (push build); running packaging smoke-test."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base"...HEAD | grep -qE '^(scripts/generate-mcpb\.sh|scripts/Dockerfile\.mcpb|Makefile|docs/images/theHivelogo\.png|\.github/workflows/ci\.yml)$'; then
            echo "MCPB packaging inputs changed; running smoke-test."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No MCPB packaging inputs changed; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          # Pin the concrete patch (keep in sync with the `toolchain` directive
          # in go.mod). Combined with the job-level GOTOOLCHAIN=local, this keeps
          # the toolchain out of GOMODCACHE so the module-cache restore doesn't
          # collide with it.
          go-version: '1.26.5'

      - name: Package MCPB (smoke-test)
        if: steps.changes.outputs.run == 'true'
        run: make mcpb-smoke

      - name: Assert MCPB artifact is non-empty and has a manifest
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          mcpb=$(find dist -name 'thehivemcp-*-linux-amd64.mcpb' -type f | head -1)
          if [ -z "$mcpb" ]; then
            echo "::error::No .mcpb produced by mcpb-smoke" >&2
            exit 1
          fi
          if [ ! -s "$mcpb" ]; then
            echo "::error::MCPB artifact is empty: $mcpb" >&2
            exit 1
          fi
          # A .mcpb is a zip; confirm it actually contains the manifest.
          if ! unzip -l "$mcpb" | grep -q 'manifest\.json'; then
            echo "::error::MCPB artifact has no manifest.json: $mcpb" >&2
            exit 1
          fi
          echo "OK: $mcpb ($(stat -c%s "$mcpb") bytes) contains manifest.json"

  integration-tests:
    runs-on: ubuntu-latest
    # `packages: read` scopes the GITHUB_TOKEN used by the ghcr login below.
    # NOTE: GITHUB_TOKEN is scoped to THIS repo, not the whole org — it can only
    # read the `strangebee/tools/licensing` image if that package explicitly
    # grants StrangeBee/TheHiveMCP read access (ghcr → package → Package settings
    # → Manage Actions access). Without that grant the probe gets `denied` (login
    # still succeeds), so the suite falls back to the sequential free-license path
    # — which is also the public-mirror behavior. To run parallel here, either add
    # that package grant or swap the login below to an org-scoped read:packages
    # token. See scripts/reset-integration-db.sh (pick_licensing_image) for the gate.
    permissions:
      contents: read
      packages: read
    # GO_CACHE_DIR makes the Makefile bind these host dirs into the go-test
    # container as the runner uid (see the Makefile note), so the cache below is
    # actually mounted AND is runner-owned for actions/cache to save.
    env:
      GO_CACHE_DIR: /home/runner/.cache/thehivemcp-go
    # Run the integration suite against every supported TheHive version, so a
    # compatibility break against any of them turns the PR red instead of going
    # unnoticed (see DL-6007). `make test-integration` brings up the docker-compose
    # test stack (TheHive + Elasticsearch + Cassandra + MITRE) for the selected
    # THEHIVE_TEST_IMAGE. It deliberately LEAVES the stack up (for fast local
    # reruns), so the teardown step below runs it down explicitly — with
    # `if: always()` so it fires even when the tests fail. Each leg boots a full
    # TheHive (~5 min startup); keep this to the versions we actually support.
    strategy:
      fail-fast: false
      matrix:
        thehive-image:
          - strangebee/thehive:5.5.2
          - strangebee/thehive:5.6.3
    steps:
      - uses: actions/checkout@v4

      # Persist the Go caches the test container uses (module cache, build cache,
      # and the go-installed gotestsum) across runs. Without this each fresh runner
      # re-downloads every module, recompiles the whole test binary, and rebuilds
      # gotestsum — ~2min per job. Keyed on go.sum so a dependency change busts it.
      # The matrix leg is IN THE KEY: the two legs run concurrently and would
      # otherwise collide on one key — both miss, then race to save it and one
      # fails with "Unable to reserve cache … another job may be creating this
      # cache", so a leg's cache never persists. A per-leg key lets each save and
      # restore its own. Separate prefix from the checks job: this cache also holds
      # gotestsum and test-compiled objects that job doesn't need.
      # NOTE: caches saved on a PR's refs/pull/N/merge ref do not reliably restore
      # across separate runs; the durable warm baseline is the cache main saves
      # once this merges (main's caches are readable by all branches).
      - name: Cache Go caches (integration)
        uses: actions/cache@v4
        with:
          path: ${{ env.GO_CACHE_DIR }}
          key: go-int-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ strategy.job-index }}
          restore-keys: |
            go-int-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-int-${{ runner.os }}-

      - name: Prepare cache dirs
        run: mkdir -p "$GO_CACHE_DIR"/gomod "$GO_CACHE_DIR"/gobuild "$GO_CACHE_DIR"/go-tools

      # Parallel mode needs a license token (see scripts/reset-integration-db.sh).
      # The primary path is the THEHIVE_TEST_LICENSE secret passed to the run step
      # below — used directly, no image pull or mint. This ghcr login is now only a
      # best-effort fallback for the mint path (an authenticated dev running CI
      # without the secret); on the public mirror it simply fails and the suite
      # falls back to sequential free mode. NOTE: the repo GITHUB_TOKEN is often
      # `denied` on the licensing package (see the `permissions` note above), which
      # is exactly why the secret is the primary path.
      - name: Log in to ghcr.io (best-effort)
        continue-on-error: true
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: make test-integration
        env:
          THEHIVE_TEST_IMAGE: ${{ matrix.thehive-image }}
          # A pre-minted multi-instance dev license. When set, the suite runs
          # parallel one-org-per-test without needing the licensing image pullable.
          # Empty on the public mirror (secret absent) ⇒ sequential free mode.
          THEHIVE_TEST_LICENSE: ${{ secrets.THEHIVE_TEST_LICENSE }}

      - name: Tear down integration test stack
        if: always()
        run: make test-integration-down
