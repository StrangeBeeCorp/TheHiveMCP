name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # Skip CI for docs-only changes — these can't affect the code checks or the
    # integration suite, and the integration matrix boots a full TheHive per leg
    # (~5 min each). Safe because no job here is a required status check on main;
    # if that changes, switch to a paths-filter gate job so skips still report.
    paths-ignore:
      - '**/*.md'
      - '.markdownlint.jsonc'
      - 'LICENSE'
      - 'NOTICE'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The make targets run inside pinned images and bind-mount the runner's
      # Go and golangci-lint caches (see DOCKER_CACHE_MOUNTS and the lint target
      # in the Makefile: go env GOPATH is /home/runner/go on ubuntu-latest).
      # Without this every run re-downloads the whole dependency graph, recompiles
      # gosec/govulncheck, rebuilds every package, and re-analyzes every file with
      # golangci-lint from scratch. Three distinct caches:
      #   ~/go/pkg/mod          — downloaded dependency source (module cache)
      #   ~/.cache/go-build     — compiled package objects (GOCACHE: go build/test + golangci-lint)
      #   ~/.cache/golangci-lint — golangci-lint's own per-file analysis results
      # Keyed on go.sum + the lint config so a dependency or lint-rule change busts
      # it; restore-keys allow a partial warm start on a miss.
      - name: Cache Go and golangci-lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            go-${{ runner.os }}-

      - name: Format check
        run: make fmt

      - name: Run linter
        run: make lint

      - name: Run SAST
        run: make sast

      - name: Run vulnerability scan
        run: make vulncheck

  docker-build:
    # Smoke-test that the production image still builds from deployment/Dockerfile
    # (a broken COPY, a renamed cmd/ path, or a bad base digest is not caught by
    # go build / golangci-lint alone). Runs in parallel with the other jobs and
    # does not push — it only proves the image assembles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: thehivemcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    runs-on: ubuntu-latest
    # Run the integration suite against every supported TheHive version, so a
    # compatibility break against any of them turns the PR red instead of going
    # unnoticed (see DL-6007). `make test-integration` brings up the docker-compose
    # test stack (TheHive + Elasticsearch + MITRE) for the selected THEHIVE_TEST_IMAGE
    # and tears it down after. Each leg boots a full TheHive (~5 min startup);
    # keep this to the versions we actually support.
    strategy:
      fail-fast: false
      matrix:
        thehive-image:
          - strangebee/thehive:5.5.2
          - strangebee/thehive:5.6.3
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: make test-integration
        env:
          THEHIVE_TEST_IMAGE: ${{ matrix.thehive-image }}
