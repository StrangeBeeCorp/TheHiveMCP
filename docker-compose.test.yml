# Test-scope stack for the integration suite, brought up and torn down by
# `make test-integration`. Replaces the in-Go testcontainers orchestration: the Go tests
# connect to the published TheHive port via THEHIVE_TEST_URL and never touch
# the Docker socket.
#
# Elasticsearch is mandatory, not optional: the *Light similarity queries
# (similarCasesLight / similarAlertsLight) are Elasticsearch-backed and
# silently return [] on the standalone image's default Lucene backend, so an
# ES-less run would pass while testing nothing. TheHive 5.x requires
# Elasticsearch 7.17.x (8.x is unsupported).
#
# Readiness is handled Go-side (testutils.StartTheHiveContainer polls
# /api/status), not by compose healthchecks, because the TheHive and ES images
# do not ship a guaranteed in-container HTTP client to probe with.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Cap the heap so the ES + TheHive stack fits on a 16 GB CI runner.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

  thehive:
    # THEHIVE_TEST_IMAGE is the single source of truth for the version under
    # test; CI sets it per matrix leg (5.5.2 / 5.6.3).
    image: ${THEHIVE_TEST_IMAGE:-strangebee/thehive:5.6.3}
    depends_on:
      - elasticsearch
    environment:
      TH_INDEX_BACKEND: elasticsearch
      TH_ELASTICSEARCH_HOSTNAMES: elasticsearch
    ports:
      - "9000:9000"

  # Serves the minimal MITRE ATT&CK STIX bundle that initHiveInstance imports.
  # TheHive fetches it server-side over the compose network as `mitre-server`.
  mitre-server:
    image: nginx:alpine
    volumes:
      - ./internal/testutils/testdata/mitre.json:/usr/share/nginx/html/mitre.json:ro
