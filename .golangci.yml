version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    # Disable overly strict linters for this project
    - cyclop
    - depguard
    - dupl
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godot
    - err113
    - mnd
    - gomoddirectives
    - ireturn
    - lll
    - maintidx
    - nestif
    - nlreturn
    - nonamedreturns
    - paralleltest
    - prealloc
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl

  exclusions:
    # Exclude the generated test directory completely
    paths:
      - "thehive/test/.*\\.go$"
    # Ignore deprecation warnings (SA1019) in the generated code
    rules:
      - path: "thehive/test/.*\\.go$"
        text: "SA1019:"
