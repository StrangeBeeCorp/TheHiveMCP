version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    # Disable overly strict linters for this project
    - cyclop
    - depguard
    - dupl
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocyclo
    - godot
    - err113
    - mnd
    - gomoddirectives
    - gomodguard # deprecated in v2.12.0; gomodguard_v2 is enabled via `default: all`
    - ireturn
    - lll
    - maintidx
    - nestif
    - nlreturn
    - nonamedreturns
    - paralleltest
    - prealloc
    # JSON/YAML tags mirror TheHive's wire format (_id, _createdAt) and the
    # MCP tool parameter contract (kebab-case); renaming them breaks compatibility
    - tagliatelle
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl

  exclusions:
    # Exclude the generated test directory completely
    paths:
      - "thehive/test/.*\\.go$"
    # Ignore deprecation warnings (SA1019) in the generated code
    rules:
      - path: "thehive/test/.*\\.go$"
        text: "SA1019:"
