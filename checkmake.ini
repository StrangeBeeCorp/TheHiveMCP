# checkmake rule config. Read by scripts/lint.sh (make lint / lint-makefile),
# mounted read-only into the pinned checkmake image.
#
# maxBodyLength: tightened below checkmake's default (20) to 10. This PR moved the
# long recipe bodies into scripts/ (run-integration-tests.sh, package-mcpb-ci.sh,
# package-tarballs.sh), so the recipes that once ran long — test-integration,
# mcpb-ci-nobuild, package-from-built — are now short shells around a script.
# The lower ceiling keeps them that way: new logic belongs in a script, not a recipe.
[maxbodylength]
maxBodyLength = 10

# phonydeclared / uniquetargets are ENABLED. checkmake (v0.3.x) has a parser bug
# where a recipe line carrying a literal `:` (e.g. the `$(CURDIR):/app` volume
# mount) that directly follows an `ifeq (…)` conditional is reparsed as a target
# declaration — the `:` reads as the rule separator — yielding a phantom
# "docker run … $(CURDIR)" target that trips both rules. The Makefile sidesteps
# this by hoisting the mount into the $(MOUNT_APP) variable (see its comment),
# so no literal `:/app` appears on a recipe line and the rules stay active.
