# SonarCloud (Automatic Analysis) configuration.
#
# The docs/evaluation/<version>/report.html files are generated chart-based
# visualization artifacts (they load a charting library from a CDN), not
# project source code. They are published for human inspection alongside the
# canonical results.csv, and should not be scanned or gated by static analysis.
#
# The harness's three http:// URLs (the dev stack's TheHive :9000 and Elasticsearch :9200, which
# only serve http, and Microsoft's RFC-3161 timestamp server, http by design: the token is signed)
# carry a `// NOSONAR` on their own line, with why, so the files around them stay analysed.
sonar.exclusions=docs/evaluation/**/*.html
