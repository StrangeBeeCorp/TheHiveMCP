# SonarCloud (Automatic Analysis) configuration.
#
# The evaluation evidence under docs/evaluation/<version>/report.html files are
# generated, self-contained visualization artifacts (chart-based HTML with a
# vendored charting library), not project source code. They are published for
# human inspection alongside the canonical results.csv, and should not be
# scanned or gated by static analysis.
sonar.exclusions=docs/evaluation/**/*.html
