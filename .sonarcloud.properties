# SonarCloud (Automatic Analysis) configuration.
#
# The docs/evaluation/<version>/report.html files are generated chart-based
# visualization artifacts (they load a charting library from a CDN), not
# project source code. They are published for human inspection alongside the
# canonical results.csv, and should not be scanned or gated by static analysis.
#
# scripts/reset-integration-db.sh and scripts/sign-windows.sh are dev/CI helper
# scripts whose only findings are "clear-text protocol" (S5332) vulnerabilities
# on http:// URLs that are intentional and safe: localhost dev-container
# endpoints (TheHive :9000 / Elasticsearch :9200, which only serve http) and
# Microsoft's RFC-3161 timestamp server (http://timestamp.acs.microsoft.com —
# http by design; the timestamp token is itself cryptographically signed). These
# cannot move to https, so they are excluded here rather than left to fail the
# new-code Quality Gate. Automatic Analysis honors sonar.exclusions but not
# per-issue ignore rules, so file-level exclusion is the code-only lever
# available; the alternative is marking the individual issues "Safe" in the
# SonarQube UI, which keeps these files under analysis.
sonar.exclusions=docs/evaluation/**/*.html,scripts/reset-integration-db.sh,scripts/sign-windows.sh
