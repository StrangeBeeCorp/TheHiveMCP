repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # A patch's blank context lines are a single space: the canaries must stay byte for byte.
      - id: trailing-whitespace
        exclude: ^gates/canaries/.*\.patch$
      - id: end-of-file-fixer
        exclude: ^gates/canaries/.*\.patch$
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: Go Format
        entry: make fmt
        language: system
        types: [go]
        pass_filenames: false

      - id: go-lint
        name: Go Lint
        entry: make lint
        language: system
        types: [go]
        pass_filenames: false
